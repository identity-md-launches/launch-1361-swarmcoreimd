[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# The independent verifier carries this exact compiler offline.
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false

# The launch compares deployed bytes without the metadata hash.
bytecode_hash = "none"
cbor_metadata = false

# No external process or filesystem access from tests.
ffi = false
fs_permissions = []

remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[fuzz]
runs = 256

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
